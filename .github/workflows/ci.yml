name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "setuptools>=68" "pytest>=8,<10" "jsonschema>=4.18"
      - run: python -m pytest
      - run: python -m build --wheel --outdir dist

